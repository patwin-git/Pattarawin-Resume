<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Illustrated executive portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#A2C6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="58%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2480"/>
      <stop offset="1" stop-color="#030059"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7AADFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7AADFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="400" height="500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="400" height="500" fill="url(#bg)"/>
    <rect width="400" height="500" fill="url(#glow)"/>

    <!-- Soft halo behind the figure -->
    <circle cx="200" cy="225" r="150" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="200" cy="225" r="118" fill="#030059" opacity="0.04"/>

    <!-- Executive silhouette: shoulders, neck, head as one navy figure -->
    <g fill="url(#figure)">
      <!-- Shoulders / torso -->
      <path d="M44 500 C44 408 112 360 200 360 C288 360 356 408 356 500 Z"/>
      <!-- Neck -->
      <rect x="172" y="300" width="56" height="78" rx="22"/>
      <!-- Head -->
      <ellipse cx="200" cy="232" rx="78" ry="92"/>
    </g>

    <!-- Subtle side shine for depth -->
    <ellipse cx="172" cy="220" rx="60" ry="84" fill="url(#shine)"/>

    <!-- Crisp shirt collar + accent tie to read as business attire -->
    <path d="M200 372 L176 392 L200 416 L224 392 Z" fill="#F5F8FF"/>
    <path d="M200 416 L188 470 L200 500 L212 470 Z" fill="#7AADFF"/>
  </g>
</svg>
